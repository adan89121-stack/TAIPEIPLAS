<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TaipeiPLAS 客戶對談快記</title>
  <style>
    :root{--ink:#14372f;--green:#07835d;--pale:#eff9f5;--line:#d7e5df;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:540px;min-height:100vh;margin:auto;padding:24px 20px calc(30px + env(safe-area-inset-bottom));background:#fff}h1{font-size:25px;margin:6px 0}.sub,.hint{color:#697a75}.sub{margin:5px 0 26px}.section{padding:21px 0;border-top:1px solid var(--line)}label,.title{display:block;font-weight:750;margin-bottom:10px}.req{color:var(--red)}input,textarea{width:100%;border:1px solid #b9cbc4;border-radius:12px;padding:13px;font:16px inherit}textarea{height:90px;resize:vertical}.pick{min-height:112px;display:flex;justify-content:center;align-items:center;text-align:center;border:2px dashed #9bb7ac;border-radius:16px;background:var(--pale);cursor:pointer}.pick input{display:none}.done{display:none;color:var(--green);font-weight:700;margin-top:9px}#preview{display:none;width:100%;max-height:250px;object-fit:contain;background:#f6f6f6;border-radius:12px;margin-top:12px}.timer{text-align:center;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px}.row{display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:15px 16px;font:750 16px inherit;cursor:pointer}.primary{width:100%;color:#fff;background:var(--green)}.recording{background:#c92a2a}.secondary{flex:1;background:#e8f2ee;color:var(--ink)}.hidden{display:none!important}.audio{display:none;width:100%;margin-top:14px}.error{display:none;color:var(--red);margin:12px 0;font-size:14px}.overlay{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#fffffff0;z-index:5}.panel{width:100%;max-width:350px;text-align:center}.spin{width:42px;height:42px;border:4px solid #dbe8e2;border-top-color:var(--green);border-radius:50%;margin:auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.id{font-size:29px;font-weight:800;margin:16px}
  </style>
</head>
<body><main>
  <h1>TaipeiPLAS 客戶對談快記</h1><p class="sub">60 秒完成一筆客戶紀錄</p>
  <form id="form">
    <div class="section"><label>業務／代理商姓名 <span class="req">*</span><input id="sales" maxlength="40" required></label></div>
    <div class="section"><div class="title">① 客戶名片 <span class="req">*</span></div><label class="pick">📷&nbsp;拍攝／上傳名片<input id="cardInput" type="file" accept="image/*" capture="environment"></label><div id="cardDone" class="done">✓ 名片已完成</div><img id="preview" alt="名片預覽"></div>
    <div class="section"><div class="title">② 客戶對談 <span class="req">*</span></div><div id="timer" class="timer">00:00</div><div class="row"><button id="record" class="btn primary" type="button">🎤 開始錄音</button><button id="redo" class="btn secondary hidden" type="button">↻ 重錄</button></div><audio id="player" class="audio" controls></audio><p class="hint">最長 60 秒。首次使用請允許麥克風。</p></div>
    <div class="section"><label>③ 補充備註<textarea id="notes" maxlength="1000" placeholder="例如：VSE 150T、明年換機"></textarea></label></div>
    <div id="error" class="error"></div><button class="btn primary" type="submit">送出客戶資料</button>
  </form>
</main><iframe id="receiver" name="receiver" class="hidden"></iframe>
<div id="upload" class="overlay"><div class="panel"><div class="spin"></div><h2>資料上傳中…</h2><p>名片 ✓<br>錄音 ✓<br>正在建立客戶紀錄</p></div></div>
<div id="success" class="overlay"><div class="panel"><div style="font-size:56px;color:#07835d">✓</div><h2>客戶資料建立成功</h2><p>客戶編號</p><div id="customerId" class="id"></div><button id="next" class="btn primary" type="button">＋ 建立下一筆客戶</button></div></div>
<script>
  // Replace this after deploying the Apps Script receiver. It must end in /exec.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhmBMH3FigOFN5wHJ_d6hjIvGjyQwEy77nlGlFy8CYZxwiMQzlBD47BVoMQfkv7MZE/exec';
  const $=id=>document.getElementById(id);let card,audio,recorder,stream,chunks=[],sec=0,ticker;
  $('sales').value=localStorage.getItem('tp2026Sales')||'';
  $('cardInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;card={dataUrl:await imageData(f),name:f.name};$('preview').src=card.dataUrl;$('preview').style.display='block';$('cardDone').style.display='block'};
  $('record').onclick=()=>recorder?.state==='recording'?stop():start();$('redo').onclick=()=>{clearAudio();start()};
  async function start(){hideError();try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('你的手機瀏覽器不支援網頁錄音，請使用最新版 Chrome 或 Safari。');stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{const b=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});audio={dataUrl:await dataUrl(b),name:'recording.'+(b.type.includes('mp4')?'m4a':'webm')};$('player').src=audio.dataUrl;$('player').style.display='block';$('redo').classList.remove('hidden');$('record').classList.add('hidden');stream?.getTracks().forEach(t=>t.stop())};recorder.start(1000);sec=0;clock();ticker=setInterval(()=>{sec++;clock();if(sec>=60)stop()},1000);$('record').textContent='■ 停止錄音';$('record').classList.add('recording')}catch(e){showError(e.message.includes('NotAllowed')?'請在瀏覽器設定中允許「麥克風」權限後重試。':e.message)}}
  function stop(){recorder?.state==='recording'&&recorder.stop();clearInterval(ticker);$('record').textContent='🎤 開始錄音';$('record').classList.remove('recording')}function clock(){$('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function clearAudio(){audio=null;$('player').removeAttribute('src');$('player').style.display='none';$('redo').classList.add('hidden');sec=0;clock()}
  $('form').onsubmit=e=>{e.preventDefault();const sales=$('sales').value.trim();if(!sales)return showError('請填寫業務／代理商姓名。');if(!card)return showError('請拍攝或上傳名片。');if(!audio)return showError('請完成錄音。');if(APPS_SCRIPT_URL.includes('PASTE_'))return showError('尚未設定 Apps Script 網址。');localStorage.setItem('tp2026Sales',sales);$('upload').style.display='grid';const form=document.createElement('form');form.method='post';form.action=APPS_SCRIPT_URL;form.target='receiver';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({salesName:sales,card,audio,notes:$('notes').value,returnOrigin:location.origin});form.append(input);document.body.append(form);form.submit();form.remove();setTimeout(()=>{if($('upload').style.display!=='none'){ $('upload').style.display='none';showError('上傳等待逾時，請確認網路後重試。');}},90000)};
  window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='TP2026_SUBMISSION_RESULT')return;$('upload').style.display='none';if(!d.ok)return showError(d.error||'上傳失敗，請重試。');$('customerId').textContent=d.customerId;$('success').style.display='grid'});
  $('next').onclick=()=>{card=null;clearAudio();$('cardInput').value='';$('notes').value='';$('preview').style.display='none';$('cardDone').style.display='none';$('record').classList.remove('hidden');$('success').style.display='none';scrollTo(0,0)};
  function dataUrl(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}function imageData(f){return new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};i.onerror=no;i.src=u})}function showError(s){$('error').textContent=s;$('error').style.display='block'}function hideError(){$('error').style.display='none'}
</script></body></html>
